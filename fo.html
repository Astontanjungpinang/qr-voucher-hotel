<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FO - Cetak Voucher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background-color: #eef2f5; padding: 20px; }
        @media print {
            body * { visibility: hidden; }
            #printableVoucher, #printableVoucher * { visibility: visible; }
            #printableVoucher { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>
<div class="container no-print" style="max-width: 500px;">
    <a href="index.html" class="btn btn-sm btn-outline-secondary mb-3">&larr; Kembali</a>
    <div class="card p-4 shadow-sm">
        <h4 class="mb-3 text-primary">Buat Voucher Breakfast</h4>
        <form id="voucherForm">
            <div class="mb-3">
                <label class="form-label">Nomor Kamar</label>
                <input type="text" id="noKamar" class="form-control" placeholder="Contoh: 301" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Jumlah Tamu (Pax)</label>
                <input type="number" id="pax" class="form-control" value="2" min="1" required>
            </div>
            <div class="row">
                <div class="col-6 mb-3">
                    <label class="form-label">Tgl Check-in</label>
                    <input type="date" id="tglCheckin" class="form-control" required>
                </div>
                <div class="col-6 mb-3">
                    <label class="form-label">Tgl Check-out</label>
                    <input type="date" id="tglCheckout" class="form-control" required>
                </div>
            </div>
            <button type="submit" id="btnSubmit" class="btn btn-primary w-100">Buat & Generate QR</button>
        </form>
    </div>
</div>

<!-- Tampilan Cetak Voucher -->
<div id="printableVoucher" class="text-center p-3 m-auto bg-white border" style="max-width: 300px; display: none;">
    <h5 class="fw-bold mb-1">HOTEL BREAKFAST VOUCHER</h5>
    <hr class="my-2">
    <p class="mb-1">No Kamar: <strong id="printKamar">-</strong></p>
    <p class="mb-1">Jumlah Tamu: <strong id="printPax">-</strong> Pax</p>
    <p class="mb-1">Check-in: <span id="printIn">-</span></p>
    <p class="mb-2">Check-out: <span id="printOut">-</span></p>
    <div id="qrcode" class="d-flex justify-content-center my-3"></div>
    <small class="text-muted">Harap tunjukkan voucher ini ke staf restoran.</small>
    <div class="mt-3 no-print">
        <button onclick="window.print()" class="btn btn-success w-100">Cetak Kertas (Print)</button>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxmqGQ5M0yoJCXQ_3A2_jFMkygYaU4oJW-5TWvceKVlT72OKjpQTdXAc3tjy26_KzbzQg/exec";

    // Set default tanggal hari ini (Check-in) & besok (Check-out)
    const today = new Date();
    const tomorrow = new Date();
    tomorrow.setDate(today.getDate() + 1);

    document.getElementById('tglCheckin').value = today.toISOString().split('T')[0];
    document.getElementById('tglCheckout').value = tomorrow.toISOString().split('T')[0];

    document.getElementById('voucherForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.disabled = true;
        btn.innerText = "Memproses...";

        const noKamar = document.getElementById('noKamar').value;
        const pax = document.getElementById('pax').value;
        const tglCheckin = document.getElementById('tglCheckin').value;
        const tglCheckout = document.getElementById('tglCheckout').value;

        fetch(`${API_URL}?action=create&noKamar=${noKamar}&pax=${pax}&tglCheckin=${tglCheckin}&tglCheckout=${tglCheckout}`)
        .then(res => res.json())
        .then(data => {
            if(data.result === 'success') {
                document.getElementById('printKamar').innerText = noKamar;
                document.getElementById('printPax').innerText = pax;
                document.getElementById('printIn').innerText = tglCheckin;
                document.getElementById('printOut').innerText = tglCheckout;
                
                document.getElementById('qrcode').innerHTML = "";
                new QRCode(document.getElementById("qrcode"), {
                    text: data.voucherId,
                    width: 150,
                    height: 150
                });

                document.getElementById('printableVoucher').style.display = "block";
                btn.disabled = false;
                btn.innerText = "Buat & Generate QR";
            }
        })
        .catch(err => {
            alert("Gagal koneksi ke server database!");
            btn.disabled = false;
            btn.innerText = "Buat & Generate QR";
        });
    });
</script>
</body>
</html>
