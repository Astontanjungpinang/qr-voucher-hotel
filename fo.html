<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FO - Cetak & Reprint Voucher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background-color: #eef2f5; padding: 20px; }
        @media print {
            body * { visibility: hidden; }
            #printableVoucher, #printableVoucher * { visibility: visible; }
            #printableVoucher { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>
<div class="container no-print" style="max-width: 500px;">
    <a href="index.html" class="btn btn-sm btn-outline-secondary mb-3">&larr; Kembali</a>
    
    <!-- Tab Navigasi FO -->
    <ul class="nav nav-pills nav-justified mb-3" id="foTab" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" id="create-tab" data-bs-toggle="tab" data-bs-target="#createPane">Buat Voucher Baru</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="reprint-tab" data-bs-toggle="tab" data-bs-target="#reprintPane">Cetak Ulang (Hilang)</button>
        </li>
    </ul>

    <div class="tab-content" id="foTabContent">
        <!-- Form 1: Buat Voucher Baru -->
        <div class="tab-pane fade show active card p-4 shadow-sm" id="createPane">
            <h4 class="mb-3 text-primary">Buat Voucher Breakfast</h4>
            <form id="voucherForm">
                <div class="mb-3">
                    <label class="form-label">Nomor Kamar</label>
                    <input type="text" id="noKamar" class="form-control" placeholder="Contoh: 301" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Jumlah Tamu (Pax)</label>
                    <input type="number" id="pax" class="form-control" value="2" min="1" required>
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label">Tgl Check-in</label>
                        <input type="date" id="tglCheckin" class="form-control" required>
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label">Tgl Check-out</label>
                        <input type="date" id="tglCheckout" class="form-control" required>
                    </div>
                </div>
                <button type="submit" id="btnSubmit" class="btn btn-primary w-100">Buat & Generate QR</button>
            </form>
        </div>

        <!-- Form 2: Cetak Ulang Voucher -->
        <div class="tab-pane fade card p-4 shadow-sm" id="reprintPane">
            <h4 class="mb-3 text-warning">Cetak Ulang Voucher Hilang</h4>
            <form id="reprintForm">
                <div class="mb-3">
                    <label class="form-label">Nomor Kamar Tamu</label>
                    <input type="text" id="searchKamar" class="form-control" placeholder="Contoh: 301" required>
                </div>
                <button type="submit" id="btnReprintSubmit" class="btn btn-warning w-100 fw-bold">Cari Data Voucher</button>
            </form>
        </div>
    </div>
</div>

<!-- Tampilan Struk / Kertas Voucher yang Akan Dicetak -->
<div id="printableVoucher" class="text-center p-3 m-auto bg-white border" style="max-width: 300px; display: none;">
    <h5 class="fw-bold mb-1">HOTEL BREAKFAST VOUCHER</h5>
    <span id="reprintBadge" class="badge bg-secondary mb-1" style="display:none;">DUPLIKAT / REPRINT</span>
    <hr class="my-2">
    <p class="mb-1">No Kamar: <strong id="printKamar">-</strong></p>
    <p class="mb-1">Jumlah Tamu: <strong id="printPax">-</strong> Pax</p>
    <hr class="my-1">
    <p class="mb-1" style="font-size: 0.9rem;">Berlaku Sarapan:</p>
    <p class="mb-2"><strong id="printBerlaku">-</strong></p>
    <div id="qrcode" class="d-flex justify-content-center my-3"></div>
    <small class="text-muted">Harap tunjukkan voucher ini ke staf restoran.</small>
    <div class="mt-3 no-print">
        <button onclick="window.print()" class="btn btn-success w-100">Cetak Kertas (Print)</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.min.js"></script>
<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxYFfGCsueJbGVdpo--wU_29Lb3oXUA6UXLLpyJVinm20xWSUQCPhSJ1nz3AFL1K8qbtQ/exec";

    // Dapatkan tanggal hari ini (format YYYY-MM-DD)
    const today = new Date();
    const todayStr = today.toISOString().split('T')[0];

    // Dapatkan tanggal besok untuk default Check-out
    const tomorrow = new Date();
    tomorrow.setDate(today.getDate() + 1);
    const tomorrowStr = tomorrow.toISOString().split('T')[0];

    // Elemen Input Tanggal
    const inputCheckin = document.getElementById('tglCheckin');
    const inputCheckout = document.getElementById('tglCheckout');

    // Set batas minimum (min) agar tidak bisa milih tanggal lalu/backdate
    inputCheckin.min = todayStr;
    inputCheckout.min = todayStr;

    // Set nilai awal (default)
    inputCheckin.value = todayStr;
    inputCheckout.value = tomorrowStr;

    // Otomatis update batas min Check-out ketika Tanggal Check-in diubah
    inputCheckin.addEventListener('change', function() {
        const selectedCheckin = inputCheckin.value;
        inputCheckout.min = selectedCheckin;
        
        if (inputCheckout.value < selectedCheckin) {
            inputCheckout.value = selectedCheckin;
        }
    });

    function showVoucherPrintout(voucherId, noKamar, pax, tglCheckin, tglCheckout, isReprint = false) {
        const checkInDate = new Date(tglCheckin);
        checkInDate.setDate(checkInDate.getDate() + 1);
        const startBreakfastStr = checkInDate.toISOString().split('T')[0];

        document.getElementById('printKamar').innerText = noKamar;
        document.getElementById('printPax').innerText = pax;
        document.getElementById('printBerlaku').innerText = `${startBreakfastStr} s/d ${tglCheckout}`;
        
        if (isReprint) {
            document.getElementById('reprintBadge').style.display = "inline-block";
        } else {
            document.getElementById('reprintBadge').style.display = "none";
        }

        document.getElementById('qrcode').innerHTML = "";
      // Ganti bagian ini di fo.html:
new QRCode(document.getElementById("qrcode"), {
    text: data.voucherId,
    width: 200,   // Diubah dari 150 ke 200
    height: 200   // Diubah dari 150 ke 200
});

        document.getElementById('printableVoucher').style.display = "block";
    }

    // Submit Buat Voucher Baru (DIPERBAIKI)
    document.getElementById('voucherForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.disabled = true;
        btn.innerText = "Memproses...";

        const noKamar = document.getElementById('noKamar').value;
        const pax = document.getElementById('pax').value;
        const tglCheckin = document.getElementById('tglCheckin').value;
        const tglCheckout = document.getElementById('tglCheckout').value;

        const targetUrl = `${API_URL}?action=create&noKamar=${encodeURIComponent(noKamar)}&pax=${encodeURIComponent(pax)}&tglCheckin=${encodeURIComponent(tglCheckin)}&tglCheckout=${encodeURIComponent(tglCheckout)}`;

        fetch(targetUrl, { method: 'GET', redirect: 'follow' })
        .then(res => {
            if (!res.ok) throw new Error("HTTP error " + res.status);
            return res.json();
        })
        .then(data => {
            if(data.result === 'success') {
                showVoucherPrintout(data.voucherId, noKamar, pax, tglCheckin, tglCheckout, false);
                btn.disabled = false;
                btn.innerText = "Buat & Generate QR";
            } else {
                alert(data.message || "Gagal membuat voucher.");
                btn.disabled = false;
                btn.innerText = "Buat & Generate QR";
            }
        })
        .catch(err => {
            console.error("Fetch Error:", err);
            alert("Gagal koneksi ke server database! Pastikan izin Google Apps Script di-set ke 'Anyone' (Siapa saja).");
            btn.disabled = false;
            btn.innerText = "Buat & Generate QR";
        });
    });

    // Submit Cari & Cetak Ulang (DIPERBAIKI)
    document.getElementById('reprintForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnReprintSubmit');
        btn.disabled = true;
        btn.innerText = "Mencari...";

        const searchKamar = document.getElementById('searchKamar').value.trim();
        const targetUrl = `${API_URL}?action=search&noKamar=${encodeURIComponent(searchKamar)}`;

        fetch(targetUrl, { method: 'GET', redirect: 'follow' })
        .then(res => {
            if (!res.ok) throw new Error("HTTP error " + res.status);
            return res.json();
        })
        .then(data => {
            if(data.result === 'success') {
                showVoucherPrintout(data.voucherId, data.noKamar, data.pax, data.tglCheckin, data.tglCheckout, true);
                btn.disabled = false;
                btn.innerText = "Cari Data Voucher";
            } else {
                alert(data.message || "Data tidak ditemukan.");
                btn.disabled = false;
                btn.innerText = "Cari Data Voucher";
            }
        })
        .catch(err => {
            console.error("Fetch Error:", err);
            alert("Gagal koneksi ke server database!");
            btn.disabled = false;
            btn.innerText = "Cari Data Voucher";
        });
    });
</script>
</body>
</html>
