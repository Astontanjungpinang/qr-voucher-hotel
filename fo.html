<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FO - Cetak & Reprint Voucher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background-color: #eef2f5; padding: 20px; }
        #qrcode canvas { display: none !important; }
        #qrcode img { display: block !important; margin: 0 auto !important; }
        
        @media print {
            body * { visibility: hidden; }
            #printableVoucher, #printableVoucher * { visibility: visible; }
            #printableVoucher { 
                position: absolute; 
                left: 50%;
                transform: translateX(-50%);
                top: 0; 
                width: 100% !important;
                max-width: 220px !important;
                border: none !important;
                box-shadow: none !important;
                margin: 0 auto !important;
                padding: 0 !important;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

<script>
    if (sessionStorage.getItem('auth_FO') !== 'true') {
        alert('Silakan login terlebih dahulu!');
        window.location.href = 'index.html';
    }
</script>

<div class="container no-print" style="max-width: 500px;">
    <a href="index.html" class="btn btn-sm btn-outline-secondary mb-3">← Kembali</a>
    
    <ul class="nav nav-pills nav-justified mb-3" id="foTab" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" id="create-tab" data-bs-toggle="tab" data-bs-target="#createPane">Buat Voucher Baru</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="reprint-tab" data-bs-toggle="tab" data-bs-target="#reprintPane">Cetak Ulang (Hilang)</button>
        </li>
    </ul>

    <div class="tab-content" id="foTabContent">
        <!-- Form Buat Voucher Baru -->
        <div class="tab-pane fade show active card p-4 shadow-sm" id="createPane">
            <h4 class="mb-3 text-primary">Buat Voucher Breakfast</h4>
            <form id="voucherForm">
                <div class="mb-3">
                    <label class="form-label fw-bold">Nomor Kamar</label>
                    <input type="text" id="noKamar" class="form-control" placeholder="Contoh: 301" required>
                </div>
                
                <!-- Opsi Jumlah Pax Dasar (Maks 2 Pax) -->
                <div class="mb-3">
                    <label class="form-label fw-bold">Jumlah Tamu Utama (Pax)</label>
                    <select id="paxUtama" class="form-select" onchange="hitungTotalPax()">
                        <option value="1">1 Pax</option>
                        <option value="2" selected>2 Pax (Maksimal Standard)</option>
                    </select>
                </div>

                <!-- Opsi Tambahan Extra Bed -->
                <div class="mb-3 p-3 bg-light rounded border">
                    <label class="form-label fw-bold text-dark mb-2">Tambahan Extra Bed</label>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="extraBedOpt" id="ebNone" value="none" checked onchange="hitungTotalPax()">
                        <label class="form-check-label" for="ebNone">Tanpa Extra Bed</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="extraBedOpt" id="ebPaid" value="paid" onchange="hitungTotalPax()">
                        <label class="form-check-label" for="ebPaid">+1 Extra Bed (Bayar) [+1 Pax]</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="extraBedOpt" id="ebCompliment" value="compliment" onchange="hitungTotalPax()">
                        <label class="form-check-label text-success fw-bold" for="ebCompliment">+1 Extra Bed Compliment (Gratis) [+1 Pax]</label>
                    </div>
                </div>

                <!-- Ringkasan Total Pax -->
                <div class="alert alert-info py-2 mb-3 d-flex justify-content-between align-items-center">
                    <span>Total Hak Sarapan:</span>
                    <strong class="fs-5" id="totalPaxDisplay">2 Pax</strong>
                </div>

                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label">Tgl Check-in</label>
                        <input type="date" id="tglCheckin" class="form-control" required>
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label">Tgl Check-out</label>
                        <input type="date" id="tglCheckout" class="form-control" required>
                    </div>
                </div>
                <button type="submit" id="btnSubmit" class="btn btn-primary w-100 fw-bold py-2">Buat & Generate QR</button>
            </form>
        </div>

        <!-- Form Cetak Ulang -->
        <div class="tab-pane fade card p-4 shadow-sm" id="reprintPane">
            <h4 class="mb-3 text-warning">Cetak Ulang Voucher Hilang</h4>
            <form id="reprintForm">
                <div class="mb-3">
                    <label class="form-label">Nomor Kamar Tamu</label>
                    <input type="text" id="searchKamar" class="form-control" placeholder="Contoh: 301" required>
                </div>
                <button type="submit" id="btnReprintSubmit" class="btn btn-warning w-100 fw-bold">Cari Data Voucher</button>
            </form>
        </div>
    </div>
</div>

<!-- Tampilan Struk Cetak Voucher Ringkas (Thermal Printer Ready) -->
<div id="printableVoucher" class="text-center p-2 m-auto bg-white border" style="max-width: 220px; font-size: 12px; display: none;">
    <h6 class="fw-bold mb-1" style="font-size: 14px;">HOTEL BREAKFAST VOUCHER</h6>
    <span id="reprintBadge" class="badge bg-secondary mb-1" style="display:none; font-size: 10px;">DUPLIKAT</span>
    <span id="ebBadge" class="badge bg-success mb-1" style="display:none; font-size: 10px;">EB COMPLIMENT</span>
    <hr class="my-1">
    <div class="d-flex justify-content-between px-1">
        <span>Kamar: <strong id="printKamar">-</strong></span>
        <span>Pax: <strong id="printPax">-</strong></span>
    </div>
    <div class="my-1" style="font-size: 11px;">
        Berlaku: <strong id="printBerlaku">-</strong>
    </div>
    <div id="qrcode" class="d-flex justify-content-center my-2"></div>
    <small class="text-muted" style="font-size: 10px;">Tunjukkan ke staf resto</small>
    <div class="mt-2 no-print">
        <button onclick="window.print()" class="btn btn-sm btn-success w-100">Cetak Kertas (Print)</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxmYMfGh5fumKE1c9ycZxEH__LZ-y_d4NIz3uIPSVygIbAtWe951JjJn2iMH2JoNtDRQQ/exec";

    const today = new Date();
    const todayStr = today.toISOString().split('T')[0];
    const tomorrow = new Date();
    tomorrow.setDate(today.getDate() + 1);
    const tomorrowStr = tomorrow.toISOString().split('T')[0];

    const inputCheckin = document.getElementById('tglCheckin');
    const inputCheckout = document.getElementById('tglCheckout');

    inputCheckin.min = todayStr;
    inputCheckout.min = todayStr;
    inputCheckin.value = todayStr;
    inputCheckout.value = tomorrowStr;

    inputCheckin.addEventListener('change', function() {
        const selectedCheckin = inputCheckin.value;
        inputCheckout.min = selectedCheckin;
        if (inputCheckout.value < selectedCheckin) {
            inputCheckout.value = selectedCheckin;
        }
    });

    // Logika Penghitungan Total Pax Berdasarkan Opsi Extra Bed
    function hitungTotalPax() {
        const paxUtama = parseInt(document.getElementById('paxUtama').value);
        const ebSelected = document.querySelector('input[name="extraBedOpt"]:checked').value;
        
        let totalPax = paxUtama;
        if (ebSelected === 'paid' || ebSelected === 'compliment') {
            totalPax += 1;
        }

        document.getElementById('totalPaxDisplay').innerText = totalPax + " Pax";
        return { totalPax, ebSelected };
    }

    function showVoucherPrintout(voucherId, noKamar, pax, tglCheckin, tglCheckout, isReprint = false, isCompliment = false) {
        const checkInDate = new Date(tglCheckin);
        checkInDate.setDate(checkInDate.getDate() + 1);
        const startBreakfastStr = checkInDate.toISOString().split('T')[0];

        document.getElementById('printKamar').innerText = noKamar;
        document.getElementById('printPax').innerText = pax;
        document.getElementById('printBerlaku').innerText = `${startBreakfastStr} s/d ${tglCheckout}`;
        
        document.getElementById('reprintBadge').style.display = isReprint ? "inline-block" : "none";
        document.getElementById('ebBadge').style.display = isCompliment ? "inline-block" : "none";

        const qrDiv = document.getElementById("qrcode");
        qrDiv.innerHTML = "";
        
        new QRCode(qrDiv, {
            text: voucherId,
            width: 130,
            height: 130
        });

        document.getElementById('printableVoucher').style.display = "block";
    }

    function callGoogleScript(params, callbackName) {
        const script = document.createElement('script');
        let queryString = '?callback=' + callbackName;
        for (let key in params) {
            queryString += '&' + key + '=' + encodeURIComponent(params[key]);
        }
        script.src = API_URL + queryString;
        
        script.onerror = function() {
            alert("Gagal koneksi ke server database!");
            const btnSubmit = document.getElementById('btnSubmit');
            if (btnSubmit) { btnSubmit.disabled = false; btnSubmit.innerText = "Buat & Generate QR"; }
        };

        document.body.appendChild(script);
        script.onload = () => document.body.removeChild(script);
    }

    window.onVoucherCreated = function(data) {
        const btn = document.getElementById('btnSubmit');
        btn.disabled = false;
        btn.innerText = "Buat & Generate QR";

        if(data.result === 'success') {
            const noKamar = document.getElementById('noKamar').value;
            const { totalPax, ebSelected } = hitungTotalPax();
            const tglCheckin = document.getElementById('tglCheckin').value;
            const tglCheckout = document.getElementById('tglCheckout').value;
            
            showVoucherPrintout(data.voucherId, noKamar, totalPax, tglCheckin, tglCheckout, false, (ebSelected === 'compliment'));
        } else {
            alert(data.message || "Gagal membuat voucher.");
        }
    };

    window.onVoucherSearched = function(data) {
        const btn = document.getElementById('btnReprintSubmit');
        btn.disabled = false;
        btn.innerText = "Cari Data Voucher";

        if(data.result === 'success') {
            showVoucherPrintout(data.voucherId, data.noKamar, data.pax, data.tglCheckin, data.tglCheckout, true, false);
        } else {
            alert(data.message || "Data tidak ditemukan.");
        }
    };

    document.getElementById('voucherForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.disabled = true;
        btn.innerText = "Memproses...";

        const { totalPax, ebSelected } = hitungTotalPax();

        callGoogleScript({
            action: 'create',
            noKamar: document.getElementById('noKamar').value,
            pax: totalPax,
            ebType: ebSelected, // Mengirim parameter ebType (none, paid, compliment)
            tglCheckin: document.getElementById('tglCheckin').value,
            tglCheckout: document.getElementById('tglCheckout').value
        }, 'onVoucherCreated');
    });

    document.getElementById('reprintForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnReprintSubmit');
        btn.disabled = true;
        btn.innerText = "Mencari...";

        callGoogleScript({
            action: 'search',
            noKamar: document.getElementById('searchKamar').value.trim()
        }, 'onVoucherSearched');
    });
</script>
</body>
</html>
