<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FO - Cetak & Reprint Voucher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background-color: #eef2f5; padding: 20px; font-family: sans-serif; }
        .qrcode-box img { display: block !important; margin: 0 auto !important; }
        
        @media print {
            body * { visibility: hidden; }
            #printableVoucherArea, #printableVoucherArea * { visibility: visible; }
            #printableVoucherArea { 
                position: absolute; 
                left: 50%;
                transform: translateX(-50%);
                top: 0; 
                width: 100% !important;
                max-width: 180px !important;
                margin: 0 auto !important;
                padding: 0 !important;
            }
            .no-print { display: none !important; }
            .voucher-card { page-break-after: always; margin-bottom: 10px; }
        }
    </style>
</head>
<body>

<script>
    if (sessionStorage.getItem('auth_FO') !== 'true') {
        alert('Silakan login terlebih dahulu!');
        window.location.href = 'index.html';
    }
</script>

<div class="container no-print" style="max-width: 500px;">
    <a href="index.html" class="btn btn-sm btn-outline-secondary mb-3">← Kembali</a>
    
    <ul class="nav nav-pills nav-justified mb-3" id="foTab">
        <li class="nav-item">
            <button class="nav-link active" id="create-tab" data-bs-toggle="tab" data-bs-target="#createPane">Buat Voucher Baru</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="reprint-tab" data-bs-toggle="tab" data-bs-target="#reprintPane">Cetak Ulang (Hilang)</button>
        </li>
    </ul>

    <div class="tab-content" id="foTabContent">
        <!-- Form Buat Voucher Baru -->
        <div class="tab-pane fade show active card p-4 shadow-sm" id="createPane">
            <h4 class="mb-3 text-primary fw-bold">Buat Voucher Breakfast</h4>
            <form id="voucherForm">
                <div class="mb-3">
                    <label class="form-label fw-bold">Nomor Kamar</label>
                    <input type="text" id="noKamar" class="form-control" placeholder="Contoh: 301" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Jumlah Tamu Utama (Pax)</label>
                    <select id="paxUtama" class="form-select" onchange="hitungTotalPax()">
                        <option value="1">1 Pax (1 QR Code)</option>
                        <option value="2" selected>2 Pax (2 QR Code Terpisah)</option>
                    </select>
                </div>

                <div class="mb-3 p-3 bg-light rounded border">
                    <label class="form-label fw-bold text-dark mb-2">Tambahan Extra Bed</label>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="extraBedOpt" id="ebNone" value="none" checked onchange="hitungTotalPax()">
                        <label class="form-check-label" for="ebNone">Tanpa Extra Bed</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="extraBedOpt" id="ebPaid" value="paid" onchange="hitungTotalPax()">
                        <label class="form-check-label" for="ebPaid">+1 Extra Bed (Bayar) [+1 QR]</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="extraBedOpt" id="ebCompliment" value="compliment" onchange="hitungTotalPax()">
                        <label class="form-check-label text-success fw-bold" for="ebCompliment">+1 Extra Bed Compliment [+1 QR]</label>
                    </div>
                </div>

                <div class="alert alert-info py-2 mb-3 d-flex justify-content-between align-items-center">
                    <span>Total Lembar QR Cetak:</span>
                    <strong class="fs-5" id="totalPaxDisplay">2 QR Code</strong>
                </div>

                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label">Tgl Check-in</label>
                        <input type="date" id="tglCheckin" class="form-control" required>
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label">Tgl Check-out</label>
                        <input type="date" id="tglCheckout" class="form-control" required>
                    </div>
                </div>
                <button type="submit" id="btnSubmit" class="btn btn-primary w-100 fw-bold py-2">Buat & Generate QR</button>
            </form>
        </div>

        <!-- Form Cetak Ulang -->
        <div class="tab-pane fade card p-4 shadow-sm" id="reprintPane">
            <h4 class="mb-3 text-warning fw-bold">Cetak Ulang Voucher Hilang</h4>
            <form id="reprintForm">
                <div class="mb-3">
                    <label class="form-label">Nomor Kamar Tamu</label>
                    <input type="text" id="searchKamar" class="form-control" placeholder="Contoh: 301" required>
                </div>
                <button type="submit" id="btnReprintSubmit" class="btn btn-warning w-100 fw-bold">Cari Data Voucher</button>
            </form>
        </div>
    </div>
</div>

<!-- Area Cetakan Thermal Multi-QR (Aston Tanjungpinang) -->
<div id="printableVoucherArea" class="m-auto bg-white" style="display: none; max-width: 180px;">
    <div id="voucherCardsContainer"></div>
    <div class="text-center mt-2 no-print">
        <button onclick="window.print()" class="btn btn-sm btn-success w-100 fw-bold">Cetak Kertas (Print All QR)</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz-APcZr1VO3IuZAx8eQi9DJR29rDp7j9WpOdwZruEvHLapDvza-S0JAX53XHS2SUeOYQ/exec";

    const today = new Date();
    const todayStr = today.toISOString().split('T')[0];
    const tomorrow = new Date();
    tomorrow.setDate(today.getDate() + 1);
    const tomorrowStr = tomorrow.toISOString().split('T')[0];

    const inputCheckin = document.getElementById('tglCheckin');
    const inputCheckout = document.getElementById('tglCheckout');

    inputCheckin.min = todayStr;
    inputCheckout.min = todayStr;
    inputCheckin.value = todayStr;
    inputCheckout.value = tomorrowStr;

    inputCheckin.addEventListener('change', function() {
        const selectedCheckin = inputCheckin.value;
        inputCheckout.min = selectedCheckin;
        if (inputCheckout.value < selectedCheckin) {
            inputCheckout.value = selectedCheckin;
        }
    });

    function hitungTotalPax() {
        const paxUtama = parseInt(document.getElementById('paxUtama').value);
        const ebSelected = document.querySelector('input[name="extraBedOpt"]:checked').value;
        
        let totalPax = paxUtama;
        if (ebSelected === 'paid' || ebSelected === 'compliment') {
            totalPax += 1;
        }

        document.getElementById('totalPaxDisplay').innerText = totalPax + " QR Code";
        return { totalPax, ebSelected };
    }

    function renderMultiQR(vouchersData, isReprint = false) {
        const container = document.getElementById('voucherCardsContainer');
        container.innerHTML = "";

        vouchersData.forEach((item, index) => {
            const checkInDate = new Date(item.tglCheckin);
            checkInDate.setDate(checkInDate.getDate() + 1);
            const startBreakfastStr = checkInDate.toISOString().split('T')[0];

            const card = document.createElement('div');
            card.className = "voucher-card text-center p-2 mb-3 border bg-white";
            card.style.fontSize = "12px";

            let ebBadgeHtml = "";
            if (item.ebType === 'compliment') {
                ebBadgeHtml = `<span class="badge bg-success mb-1" style="font-size: 9px;">EB COMPLIMENT</span><br>`;
            } else if (item.ebType === 'paid') {
                ebBadgeHtml = `<span class="badge bg-warning text-dark mb-1" style="font-size: 9px;">+1 EXTRA BED</span><br>`;
            }

            let reprintBadgeHtml = isReprint ? `<span class="badge bg-secondary mb-1" style="font-size: 9px;">DUPLIKAT</span><br>` : "";

            const qrDivId = `qrcode_${index}`;

            card.innerHTML = `
                <h6 class="fw-bold mb-0 text-uppercase" style="font-size: 13px; letter-spacing: 0.5px;">ASTON TANJUNGPINANG</h6>
                <small class="text-muted d-block mb-1" style="font-size: 8px; font-weight: 600;">HOTEL & CONFERENCE CENTER</small>
                <div class="fw-bold my-1" style="font-size: 11px; border-top: 1px dashed #ccc; border-bottom: 1px dashed #ccc; padding: 2px 0;">
                    BREAKFAST VOUCHER (${index + 1}/${vouchersData.length})
                </div>
                ${reprintBadgeHtml}
                ${ebBadgeHtml}
                <div class="d-flex justify-content-between px-1 mt-1">
                    <span>Kamar: <strong>${item.noKamar}</strong></span>
                    <span>Pax: <strong>1 Pax</strong></span>
                </div>
                <div class="my-1" style="font-size: 10px;">
                    Berlaku: <strong>${startBreakfastStr} s/d ${item.tglCheckout}</strong>
                </div>
                <div id="${qrDivId}" class="qrcode-box d-flex justify-content-center my-2"></div>
                <small class="text-muted" style="font-size: 9px;">Tunjukkan ke staf resto (Voucher ${index + 1})</small>
                <hr class="my-2" style="border-top: 1px dashed #888;">
            `;

            container.appendChild(card);

            new QRCode(document.getElementById(qrDivId), {
                text: item.voucherId,
                width: 90,
                height: 90
            });
        });

        document.getElementById('printableVoucherArea').style.display = "block";
    }

    function callGoogleScript(params, callbackName) {
        const script = document.createElement('script');
        let queryString = '?callback=' + callbackName;
        for (let key in params) {
            queryString += '&' + key + '=' + encodeURIComponent(params[key]);
        }
        script.src = API_URL + queryString;
        
        script.onerror = function() {
            alert("Gagal koneksi ke server database!");
            const btnSubmit = document.getElementById('btnSubmit');
            if (btnSubmit) { btnSubmit.disabled = false; btnSubmit.innerText = "Buat & Generate QR"; }
        };

        document.body.appendChild(script);
        script.onload = () => document.body.removeChild(script);
    }

    window.onVoucherCreated = function(data) {
        const btn = document.getElementById('btnSubmit');
        btn.disabled = false;
        btn.innerText = "Buat & Generate QR";

        if(data.result === 'success') {
            const noKamar = document.getElementById('noKamar').value;
            const tglCheckin = document.getElementById('tglCheckin').value;
            const tglCheckout = document.getElementById('tglCheckout').value;
            const { ebSelected } = hitungTotalPax();

            const vouchersList = data.vouchers.map(vId => ({
                voucherId: vId,
                noKamar: noKamar,
                tglCheckin: tglCheckin,
                tglCheckout: tglCheckout,
                ebType: ebSelected
            }));

            renderMultiQR(vouchersList, false);
        } else {
            alert(data.message || "Gagal membuat voucher.");
        }
    };

    window.onVoucherSearched = function(data) {
        const btn = document.getElementById('btnReprintSubmit');
        btn.disabled = false;
        btn.innerText = "Cari Data Voucher";

        if(data.result === 'success') {
            renderMultiQR(data.vouchers, true);
        } else {
            alert(data.message || "Data tidak ditemukan.");
        }
    };

    document.getElementById('voucherForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.disabled = true;
        btn.innerText = "Memproses...";

        const { totalPax, ebSelected } = hitungTotalPax();

        callGoogleScript({
            action: 'create',
            noKamar: document.getElementById('noKamar').value,
            pax: totalPax,
            ebType: ebSelected,
            tglCheckin: document.getElementById('tglCheckin').value,
            tglCheckout: document.getElementById('tglCheckout').value
        }, 'onVoucherCreated');
    });

    document.getElementById('reprintForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnReprintSubmit');
        btn.disabled = true;
        btn.innerText = "Mencari...";

        callGoogleScript({
            action: 'search',
            noKamar: document.getElementById('searchKamar').value.trim()
        }, 'onVoucherSearched');
    });
</script>
</body>
</html>
