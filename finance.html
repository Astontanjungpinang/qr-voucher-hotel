<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounting Report - QR Breakfast Voucher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; padding: 20px; font-family: sans-serif; }
        .table-responsive { max-height: 65vh; overflow-y: auto; }
        .voucher-code { font-family: monospace; font-weight: bold; color: #0d6efd; font-size: 0.9rem; }
        @media print {
            .no-print { display: none !important; }
            .table-responsive { max-height: none; overflow: visible; }
        }
    </style>
</head>
<body>

<script>
    // Sesuaikan dengan key sessionStorage yang dipakai di index.html Anda
    if (sessionStorage.getItem('auth_ACC') !== 'true' && sessionStorage.getItem('auth_REPORT') !== 'true') {
        alert('Silakan login terlebih dahulu melalui menu utama!');
        window.location.href = 'index.html';
    }
</script>

<div class="container-fluid" style="max-width: 1200px;">
    <div class="d-flex justify-content-between align-items-center mb-3 no-print">
        <a href="index.html" class="btn btn-sm btn-outline-secondary">← Kembali ke Menu Utama</a>
        <h4 class="fw-bold text-dark mb-0">Laporan Rekonsiliasi & Audit Voucher Breakfast</h4>
        <div>
            <button onclick="exportToCSV()" class="btn btn-sm btn-success fw-bold">Export Excel (CSV)</button>
            <button onclick="window.print()" class="btn btn-sm btn-dark fw-bold">Cetak Laporan</button>
        </div>
    </div>

    <!-- Filter Rentang Tanggal & Pencarian Nomor Voucher -->
    <div class="card p-3 mb-3 shadow-sm no-print">
        <div class="row g-2 align-items-end">
            <div class="col-md-3">
                <label class="form-label fw-bold small mb-1">Dari Tanggal (Start Date)</label>
                <input type="date" id="startDate" class="form-control form-control-sm">
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold small mb-1">Sampai Tanggal (End Date)</label>
                <input type="date" id="endDate" class="form-control form-control-sm">
            </div>
            <div class="col-md-2">
                <button onclick="loadReport()" id="btnFilter" class="btn btn-primary btn-sm w-100 fw-bold">Tampilkan Data</button>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-bold small mb-1">Cari Nomor Voucher / Kamar</label>
                <input type="text" id="searchInput" onkeyup="filterTable()" class="form-control form-control-sm" placeholder="Ketik VCH-xxx atau No. Kamar...">
            </div>
        </div>
    </div>

    <!-- Ringkasan Audit (KPI Cards) -->
    <div class="row g-2 mb-3">
        <div class="col-md-3 col-6">
            <div class="card p-2 border-start border-primary border-4 shadow-sm">
                <small class="text-muted fw-bold">Total Voucher Terbit</small>
                <h4 class="fw-bold mb-0 text-primary" id="statTotalVoucher">0</h4>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="card p-2 border-start border-success border-4 shadow-sm">
                <small class="text-muted fw-bold">Total Scan Terpakai</small>
                <h4 class="fw-bold mb-0 text-success" id="statTotalScan">0</h4>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="card p-2 border-start border-warning border-4 shadow-sm">
                <small class="text-muted fw-bold">Extra Bed (Paid)</small>
                <h4 class="fw-bold mb-0 text-warning" id="statEbPaid">0</h4>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="card p-2 border-start border-info border-4 shadow-sm">
                <small class="text-muted fw-bold">Extra Bed (Compliment)</small>
                <h4 class="fw-bold mb-0 text-info" id="statEbComp">0</h4>
            </div>
        </div>
    </div>

    <!-- Tabel Data Audit & Nomor Voucher -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-bordered align-middle mb-0" id="reportTable" style="font-size: 0.88rem;">
                    <thead class="table-dark sticky-top">
                        <tr>
                            <th>No</th>
                            <th>Nomor Voucher (ID)</th>
                            <th>Kamar</th>
                            <th>Pax</th>
                            <th>Check-in</th>
                            <th>Check-out</th>
                            <th>Kategori</th>
                            <th>Status</th>
                            <th>Jml Scan</th>
                            <th>Riwayat Waktu Scan</th>
                        </tr>
                    </thead>
                    <tbody id="reportTableBody">
                        <tr>
                            <td colspan="10" class="text-center py-4 text-muted">Memuat data laporan...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbw2Ex1G8Shy0LLy_3ymZnHJFmNhMUl6zilLobsjPJcgW91eL72z4oBv8NvFsaPfeWTU/exec";
    let currentReportData = [];

    // Set default tanggal: Tanggal 1 bulan berjalan s/d Tanggal 30/akhir bulan
    window.onload = function() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const lastDay = new Date(year, now.getMonth() + 1, 0).getDate();

        document.getElementById('startDate').value = `${year}-${month}-01`;
        document.getElementById('endDate').value = `${year}-${month}-${String(lastDay).padStart(2, '0')}`;
        
        loadReport();
    };

    function loadReport() {
        const btn = document.getElementById('btnFilter');
        btn.disabled = true;
        btn.innerText = "Memuat...";

        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;

        const script = document.createElement('script');
        script.src = `${API_URL}?action=report&startDate=${startDate}&endDate=${endDate}&callback=onReportLoaded`;
        script.onerror = function() {
            alert("Gagal mengambil data laporan dari server.");
            btn.disabled = false;
            btn.innerText = "Tampilkan Data";
        };
        document.body.appendChild(script);
        script.onload = () => document.body.removeChild(script);
    }

    window.onReportLoaded = function(res) {
        const btn = document.getElementById('btnFilter');
        btn.disabled = false;
        btn.innerText = "Tampilkan Data";

        if (res.result !== 'success') {
            alert(res.message || "Terjadi kesalahan saat memuat laporan.");
            return;
        }

        currentReportData = res.data || [];
        renderTable(currentReportData);
    };

    function renderTable(data) {
        const tbody = document.getElementById('reportTableBody');
        tbody.innerHTML = "";

        let totalVoucher = data.length;
        let totalScan = 0;
        let ebPaid = 0;
        let ebComp = 0;

        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="10" class="text-center py-4 text-muted">Tidak ada data voucher pada rentang tanggal ini.</td></tr>`;
        } else {
            data.forEach((item, index) => {
                totalScan += parseInt(item.totalScan || 0);
                if (item.ebType === 'paid') ebPaid++;
                if (item.ebType === 'compliment') ebComp++;

                let badgeCat = '<span class="badge bg-secondary">Regular</span>';
                if (item.ebType === 'paid') badgeCat = '<span class="badge bg-warning text-dark">EB Paid</span>';
                if (item.ebType === 'compliment') badgeCat = '<span class="badge bg-info text-dark">EB Compliment</span>';

                let badgeStatus = `<span class="badge bg-success">${item.status}</span>`;
                if (item.status === 'REDEEMED') badgeStatus = `<span class="badge bg-primary">REDEEMED</span>`;
                if (item.status === 'EXPIRED') badgeStatus = `<span class="badge bg-danger">EXPIRED</span>`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td class="voucher-code">${item.voucherId}</td>
                    <td class="fw-bold">${item.noKamar}</td>
                    <td>${item.pax}</td>
                    <td>${item.tglCheckin}</td>
                    <td>${item.tglCheckout}</td>
                    <td>${badgeCat}</td>
                    <td>${badgeStatus}</td>
                    <td class="fw-bold text-center">${item.totalScan}x</td>
                    <td class="small text-muted">${item.historyScan || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('statTotalVoucher').innerText = totalVoucher;
        document.getElementById('statTotalScan').innerText = totalScan;
        document.getElementById('statEbPaid').innerText = ebPaid;
        document.getElementById('statEbComp').innerText = ebComp;
    }

    function filterTable() {
        const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
        if (!keyword) {
            renderTable(currentReportData);
            return;
        }
        const filtered = currentReportData.filter(item => 
            item.voucherId.toLowerCase().includes(keyword) || 
            item.noKamar.toLowerCase().includes(keyword)
        );
        renderTable(filtered);
    }

    function exportToCSV() {
        if (currentReportData.length === 0) {
            alert("Tidak ada data untuk di-export!");
            return;
        }
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;

        let csv = "No,Nomor Voucher,No Kamar,Pax,Check-in,Check-out,Kategori,Status,Jumlah Scan,Riwayat Waktu Scan\n";
        currentReportData.forEach((row, idx) => {
            csv += `${idx + 1},"${row.voucherId}","${row.noKamar}",${row.pax},"${row.tglCheckin}","${row.tglCheckout}","${row.ebType}","${row.status}",${row.totalScan},"${row.historyScan}"\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Rekap_Voucher_Breakfast_${startDate}_sd_${endDate}.csv`;
        link.click();
    }
</script>
</body>
</html>
