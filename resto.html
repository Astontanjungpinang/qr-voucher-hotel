<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resto - QR Scanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { background-color: #121212; color: #fff; padding: 15px; }
        #reader { width: 100%; max-width: 450px; margin: auto; border-radius: 10px; overflow: hidden; background: #000; }
        .result-box { display: none; margin-top: 20px; }
    </style>
</head>
<body>
<div class="container text-center" style="max-width: 500px;">
    <a href="index.html" class="btn btn-sm btn-outline-light mb-3 float-start">← Kembali</a>
    <div class="clearfix"></div>
    <h4 class="mb-3">Scan Voucher Restoran</h4>
    
    <div id="reader"></div>

    <div id="result" class="card p-3 mt-3 result-box text-dark">
        <h3 id="resTitle" class="fw-bold"></h3>
        <p id="resMsg" class="fs-5 mb-0"></p>
        <button onclick="resetScanner()" class="btn btn-primary mt-3">Scan Voucher Lain</button>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyVzUjn-IFcOhIVZRJrf617VrmyX1-UCJ4KU237WrMNJTPzWlhUrDUnLDC6kMAdoI-zHQ/exec";
    let html5QrcodeScanner;
    let isProcessing = false;

    function onScanSuccess(decodedText, decodedResult) {
        if(isProcessing) return;
        isProcessing = true;
        
        // Dapatkan tanggal hari ini (YYYY-MM-DD)
        const today = new Date().toISOString().split('T')[0];

        document.getElementById('resTitle').innerText = "Memeriksa...";
        document.getElementById('resMsg').innerText = "Sedang verifikasi ke sistem...";
        document.getElementById('result').className = "card p-3 mt-3 result-box text-dark bg-warning";
        document.getElementById('result').style.display = "block";

        fetch(`${API_URL}?action=scan&voucherId=${decodedText}&today=${today}`)
        .then(res => res.json())
        .then(data => {
            if(data.result === 'success') {
                document.getElementById('resTitle').innerText = "BERHASIL (VALID)";
                document.getElementById('resMsg').innerHTML = `Kamar: <strong>${data.noKamar}</strong><br>Jumlah: <strong>${data.pax} Pax</strong>`;
                document.getElementById('result').className = "card p-3 mt-3 result-box text-white bg-success";
            } else {
                document.getElementById('resTitle').innerText = "VOUCHER DITOLAK";
                document.getElementById('resMsg').innerText = data.message;
                document.getElementById('result').className = "card p-3 mt-3 result-box text-white bg-danger";
            }
        })
        .catch(err => {
            document.getElementById('resTitle').innerText = "ERROR";
            document.getElementById('resMsg').innerText = "Gagal terhubung ke jaringan!";
            document.getElementById('result').className = "card p-3 mt-3 result-box text-white bg-secondary";
        });
    }

    function initScanner() {
        html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
        html5QrcodeScanner.render(onScanSuccess);
    }

    function resetScanner() {
        document.getElementById('result').style.display = "none";
        isProcessing = false;
    }

    initScanner();
</script>
</body>
</html>
