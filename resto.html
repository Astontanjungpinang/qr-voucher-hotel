<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Voucher Restoran - Aston Tanjungpinang</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            background-color: #18181b;
            color: #ffffff;
            font-family: sans-serif;
            padding: 15px;
        }
        .scanner-wrapper {
            max-width: 450px;
            margin: 0 auto;
        }
        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #3f3f46;
            background-color: #000;
        }
        .result-card {
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
        .result-valid {
            background-color: #16a34a;
            color: #ffffff;
        }
        .result-invalid {
            background-color: #dc2626;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="scanner-wrapper">
    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between mb-3">
        <a href="index.html" class="btn btn-sm btn-outline-light">← Kembali</a>
        <h5 class="fw-bold mb-0">Scan Voucher Restoran</h5>
        <div style="width: 65px;"></div>
    </div>

    <!-- Area Kamera Scanner -->
    <div id="cameraSection" class="card bg-dark border-secondary p-2 shadow">
        <div id="reader"></div>
        <div class="text-center text-secondary small mt-2" id="cameraStatus">
            Arahkan kamera ke QR Code Voucher Tamu...
        </div>
    </div>

    <!-- Tombol Scan Ulang (Muncul setelah scan selesai) -->
    <div id="rescanBtnWrapper" class="mt-3" style="display: none;">
        <button onclick="resetScanner()" class="btn btn-outline-warning w-100 fw-bold py-2">
            ↻ Scan Voucher Lain
        </button>
    </div>

    <!-- Kartu Hasil Validasi (Hijau = Valid, Merah = Tidak Valid) -->
    <div id="resultBox" class="result-card shadow">
        <h3 class="fw-bold mb-2" id="resultTitle">-</h3>
        <p class="mb-3" id="resultMessage" style="font-size: 1.05rem;">-</p>
        <div id="resultDetails" class="bg-black bg-opacity-25 rounded p-2 mb-3 small text-start" style="display: none;"></div>
        <button onclick="resetScanner()" class="btn btn-light w-100 fw-bold">
            Scan Voucher Lain
        </button>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxQpz_sQFkSP_pkibViksyA1m7k_dhKDBrEfleouz568BGiXD3tivI12sy5kgzrWowkMA/exec";
    let html5QrCode = null;
    let isProcessing = false;

    window.onload = function() {
        startCamera();
    };

    function startCamera() {
        isProcessing = false;
        document.getElementById('resultBox').style.display = 'none';
        document.getElementById('rescanBtnWrapper').style.display = 'none';
        document.getElementById('cameraSection').style.display = 'block';
        document.getElementById('cameraStatus').innerText = "Membuka kamera...";

        if (!html5QrCode) {
            html5QrCode = new Html5Qrcode("reader");
        }

        html5QrCode.start(
            { facingMode: "environment" },
            {
                fps: 10,
                qrbox: { width: 240, height: 240 }
            },
            onScanSuccess,
            (errorMessage) => {
                // Abaikan error frame kosong saat kamera mencari fokus
            }
        ).then(() => {
            document.getElementById('cameraStatus').innerText = "Arahkan kamera ke QR Code Voucher Tamu...";
        }).catch((err) => {
            document.getElementById('cameraStatus').innerHTML = 
                `<span class="text-danger">Gagal mengakses kamera: ${err}<br>Pastikan izin kamera di browser sudah diizinkan.</span>`;
        });
    }

    function onScanSuccess(decodedText) {
        if (isProcessing) return;

        let cleanVoucherId = (decodedText || "").toString().trim();

        // Jika QR Code berisi format JSON lama, ekstrak ID-nya
        if (cleanVoucherId.startsWith("{")) {
            try {
                const parsed = JSON.parse(cleanVoucherId);
                cleanVoucherId = (parsed.voucherId || parsed.id || "").toString().trim();
            } catch (e) {}
        }

        // Jangan kirim request jika hasil bacaan kosong
        if (!cleanVoucherId) return;

        isProcessing = true;

        // Hentikan kamera sementara selama proses validasi ke server
        if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.stop().catch(() => {});
        }

        document.getElementById('cameraStatus').innerText = "Memvalidasi voucher " + cleanVoucherId + "...";
        validateVoucherWithServer(cleanVoucherId);
    }

    function validateVoucherWithServer(voucherId) {
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const todayStr = `${yyyy}-${mm}-${dd}`;

        const callbackName = "onScanValidated_" + new Date().getTime();
        window[callbackName] = function(res) {
            delete window[callbackName];
            showValidationResult(res);
        };

        const script = document.createElement('script');
        script.src = `${API_URL}?action=scan&voucherId=${encodeURIComponent(voucherId)}&today=${todayStr}&callback=${callbackName}`;
        script.onerror = function() {
            delete window[callbackName];
            showValidationResult({
                result: "error",
                message: "Gagal terhubung ke server. Periksa koneksi internet!"
            });
        };
        document.body.appendChild(script);
        script.onload = () => document.body.removeChild(script);
    }

    function showValidationResult(res) {
        document.getElementById('cameraSection').style.display = 'none';
        document.getElementById('rescanBtnWrapper').style.display = 'block';

        const resultBox = document.getElementById('resultBox');
        const resultTitle = document.getElementById('resultTitle');
        const resultMessage = document.getElementById('resultMessage');
        const resultDetails = document.getElementById('resultDetails');

        resultBox.style.display = 'block';
        resultBox.classList.remove('result-valid', 'result-invalid');

        if (res && res.result === 'success') {
            resultBox.classList.add('result-valid');
            resultTitle.innerText = "VALID!";
            resultMessage.innerText = res.message || "Voucher Berhasil Digunakan";

            const d = res.data || res;
            let katLabel = "Regular";
            if (d.ebType === "paid") katLabel = "Extra Bed (Paid)";
            if (d.ebType === "compliment") katLabel = "Extra Bed (Compliment)";

            resultDetails.style.display = 'block';
            resultDetails.innerHTML = `
                <div><strong>Kode QR:</strong> ${d.voucherId || '-'}</div>
                <div><strong>Kamar:</strong> ${d.noKamar || '-'} (${d.pax || 1} Pax)</div>
                <div><strong>Kategori:</strong> ${katLabel}</div>
                <div><strong>Waktu Scan:</strong> ${d.scanTime || '-'}</div>
            `;
        } else {
            resultBox.classList.add('result-invalid');
            resultTitle.innerText = "TIDAK VALID!";
            resultMessage.innerText = (res && res.message) ? res.message : "Voucher tidak dapat digunakan.";
            resultDetails.style.display = 'none';
        }
    }

    function resetScanner() {
        startCamera();
    }
</script>
</body>
</html>
