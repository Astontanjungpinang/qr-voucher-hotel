<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem QR Voucher Breakfast Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card-menu { width: 100%; max-width: 400px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="card card-menu p-4 text-center bg-white">
        <h3 class="mb-2 fw-bold text-primary">Breakfast Voucher</h3>
        <p class="text-muted mb-4">Pilih divisi Anda untuk login:</p>
        <div class="d-grid gap-3">
            <button class="btn btn-primary btn-lg shadow-sm" onclick="openLogin('FO')">Front Office</button>
            <button class="btn btn-success btn-lg shadow-sm" onclick="openLogin('RESTO')">Staff Restoran</button>
            <!-- Tombol Accounting & Finance -->
            <button class="btn btn-dark btn-lg shadow-sm" onclick="openLogin('FINANCE')">Accounting & Finance</button>
        </div>
    </div>

    <!-- Modal Login Password -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalTitle">Login Divisi</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">Masukkan Password Akses</label>
                            <input type="password" id="inputPass" class="form-control" placeholder="Kata sandi..." required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Masuk</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let selectedDept = "";
    const loginModal = new bootstrap.Modal(document.getElementById('loginModal'));

    // PASSWORD AKSE KETIGA DIVISI
    const PASSWORDS = {
        'FO': 'fo2027',
        'RESTO': 'resto123',
        'FINANCE': 'finance321'
    };

    function openLogin(dept) {
        selectedDept = dept;
        document.getElementById('modalTitle').innerText = `Login Divisi ${dept}`;
        document.getElementById('inputPass').value = "";
        loginModal.show();
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const pass = document.getElementById('inputPass').value;

        if (pass === PASSWORDS[selectedDept]) {
            sessionStorage.setItem('auth_' + selectedDept, 'true');
            if (selectedDept === 'FO') window.location.href = 'fo.html';
            if (selectedDept === 'RESTO') window.location.href = 'resto.html';
            if (selectedDept === 'FINANCE') window.location.href = 'finance.html';
        } else {
            alert('Password Salah! Akses ditolak.');
        }
    });
</script>
</body>
</html>
